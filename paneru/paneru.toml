# ~/.config/paneru/paneru.toml
# Trial config for Paneru (https://github.com/karinushka/paneru), evaluated
# as a possible AeroSpace replacement. Bindings reuse the same Cmd+Alt
# leader and vim-style hjkl scheme as aerospace/aerospace.toml so muscle
# memory carries over; comments flag the spots where Paneru's scrolling-strip
# model has no 1:1 AeroSpace equivalent.

[options]
focus_follows_mouse = false
mouse_follows_focus = true
animation_speed = 12
window_resize_cycle = true

[padding]
top = 8
bottom = 8
left = 8
right = 8

[bindings]
# Focus a window (leader + hjkl, vim-style directions)
window_focus_west = "cmd + alt - h"
window_focus_south = "cmd + alt - j"
window_focus_north = "cmd + alt - k"
window_focus_east = "cmd + alt - l"

# Swap the focused window with its neighbor (AeroSpace's "move")
window_swap_west = "cmd + alt + shift - h"
window_swap_south = "cmd + alt + shift - j"
window_swap_north = "cmd + alt + shift - k"
window_swap_east = "cmd + alt + shift - l"

# Resize the focused window. AeroSpace stepped by a pixel amount (resize
# smart -/+50); Paneru instead cycles through [options].preset_column_widths
window_shrink = "cmd + alt - minus"
window_resize = "cmd + alt - equal"

# Float/tile toggle -- direct equivalent of AeroSpace's alt-cmd-f
window_manage = "cmd + alt - f"

# No direct equivalent of AeroSpace's accordion-layout toggle. Closest
# analogue: stack the focused window into the column on its left
window_stack = "cmd + alt - comma"
window_unstack = "cmd + alt + shift - comma"

# Closest match for AeroSpace's flatten-workspace-tree ("reset a messy
# layout") -- resizes every column to match the focused window's width
window_balance = "cmd + alt - r"

# Strip equivalent of AeroSpace's fullscreen: expands the focused window to
# the screen width without leaving the strip or hiding other apps
window_fullwidth = "cmd + alt - enter"

# Virtual workspaces 1-9, closest equivalent to AeroSpace workspaces -- but
# note these are rows stacked per-monitor, not objects portable across
# displays (aerospace.toml's move-workspace-to-monitor has no equivalent)
window_virtualnum_1 = "cmd + alt - 1"
window_virtualnum_2 = "cmd + alt - 2"
window_virtualnum_3 = "cmd + alt - 3"
window_virtualnum_4 = "cmd + alt - 4"
window_virtualnum_5 = "cmd + alt - 5"
window_virtualnum_6 = "cmd + alt - 6"
window_virtualnum_7 = "cmd + alt - 7"
window_virtualnum_8 = "cmd + alt - 8"
window_virtualnum_9 = "cmd + alt - 9"

# Send the focused window to virtual workspace 1-9 and follow it there
window_virtualmovenum_1 = "cmd + alt + shift - 1"
window_virtualmovenum_2 = "cmd + alt + shift - 2"
window_virtualmovenum_3 = "cmd + alt + shift - 3"
window_virtualmovenum_4 = "cmd + alt + shift - 4"
window_virtualmovenum_5 = "cmd + alt + shift - 5"
window_virtualmovenum_6 = "cmd + alt + shift - 6"
window_virtualmovenum_7 = "cmd + alt + shift - 7"
window_virtualmovenum_8 = "cmd + alt + shift - 8"
window_virtualmovenum_9 = "cmd + alt + shift - 9"

# Cycle virtual workspace rows -- new territory, AeroSpace has no row concept
window_virtual_north = "cmd + ctrl - k"
window_virtual_south = "cmd + ctrl - j"

# Config reloads automatically on save, so no reload-config binding needed
# (unlike aerospace.toml's alt-cmd-shift-c)
quit = "cmd + alt + shift - q"
restart = "cmd + alt + shift - r"

# ─── Window rules ──────────────────────────────────────────────
# [padding] above only controls screen-edge margins -- the gap *between*
# tiled windows is a separate per-window horizontal/vertical_padding (the
# visual gap is the sum of both neighbors' padding, so 4+4 = an 8px gap,
# matching aerospace.toml's inner.horizontal/vertical). This wildcard rule
# applies it to every window since there's no global inter-window gap option.
[windows.default]
title = ".*"
horizontal_padding = 4
vertical_padding = 4

# Mirrors the floating exceptions from aerospace.toml's on-window-detected
[windows.system-settings]
title = ".*"
bundle_id = "com.apple.systempreferences"
floating = true

[windows.finder]
title = ".*"
bundle_id = "com.apple.finder"
floating = true

[windows.kitty-scratchpad]
title = "kitty\\.scratchpad"
floating = true

[windows.browser-pip]
title = "Picture.in.[Pp]icture"
floating = true

[restore]
enabled = true
