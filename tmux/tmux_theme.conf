# Credits : Valentin Uveges (https://github.com/89iuv)
# Source : https://github.com/catppuccin/tmux/discussions/317#discussioncomment-11064512

if-shell '[ "$(~/.config/tmux/detect_theme)" = "dark" ]' \
  "source-file ~/.config/tmux/tmux_palette_dark.conf" \
  "source-file ~/.config/tmux/tmux_palette_light.conf"

set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'catppuccin/tmux'

# Configure Catppuccin
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "on"
set -g @catppuccin_pane_border_status "off"

# Configure Online
set -g @online_icon "ok"
set -g @offline_icon "nok"

# status left look and feel
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold]  #S },#{#[bg=#{@thm_bg},fg=#{@thm_green}]  #S }}"
# pane command/dir only render once the client is wide enough that they
# won't shove the window list into overlapping the rest of the bar --
# this is what used to get commented out entirely when several named
# windows were open on the built-in screen. 160 is a guess at "built-in
# screen with a handful of named windows still fits"; raise it if it's
# still cramped, or drop the #{e|>=...} wrapper on a line to always show it.
set -ga status-left "#{?#{e|>=:#{client_width},160},#{#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│},}"
set -ga status-left "#{?#{e|>=:#{client_width},160},#{#[bg=#{@thm_bg},fg=#{@thm_maroon}]  #{pane_current_command} },}"
set -ga status-left "#{?#{e|>=:#{client_width},130},#{#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│},}"
set -ga status-left "#{?#{e|>=:#{client_width},130},#{#[bg=#{@thm_bg},fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} },}"
# Zoom flag is short and rare enough to always show regardless of width
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"

# status right look and feel
set -g status-right-length 100
set -g status-right ""
# set -ga status-right "#{?#{e|>=:10,#{battery_percentage}},#{#[bg=#{@thm_red},fg=#{@thm_bg}]},#{#[bg=#{@thm_bg},fg=#{@thm_pink}]}} #{battery_icon} #{battery_percentage} "
# set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none]│"
# set -ga status-right "#[bg=#{@thm_bg}]#{?#{==:#{online_status},ok},#[fg=#{@thm_mauve}] 󰖩 on ,#[fg=#{@thm_red},bold]#[reverse] 󰖪 off }"
# set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none]│"
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_blue}] 󰭦 %Y-%m-%d 󰅐 %H:%M "

# # bootstrap tpm
# if "test ! -d ~/.tmux/plugins/tpm" \
#    "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Configure Tmux
set -g status-position top
set -g status-style "bg=#{@thm_bg}"
set -g status-justify "absolute-centre"

# pane border look and feel
setw -g pane-border-status top
setw -g pane-border-format ""
setw -g pane-active-border-style "bg=#{@thm_bg},fg=#{@thm_overlay_0}"
setw -g pane-border-style "bg=#{@thm_bg},fg=#{@thm_surface_0}"
setw -g pane-border-lines single

# window look and feel
set -wg automatic-rename on
set -g automatic-rename-format "Window"

# window_name truncated to 12 chars (with a "..." ellipsis) so a session
# with several named windows can't outgrow the screen on its own -- this
# is the other half of the overflow fix, independent of the client-width
# gating on status-left above. Uses #{window_name}, not the legacy #W
# shorthand -- confirmed live that #W silently expands to nothing when
# nested inside #{=/N/...}, #{window_name} doesn't have that problem.
set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #{=/12/...:#{window_name}},} "
set -g window-status-style "bg=#{@thm_bg},fg=#{@thm_rosewater}"
set -g window-status-last-style "bg=#{@thm_bg},fg=#{@thm_peach}"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"

set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #{=/12/...:#{window_name}},} "
set -g window-status-current-style "bg=#{@thm_peach},fg=#{@thm_bg},bold"


run '~/.tmux/plugins/tpm/tpm'
